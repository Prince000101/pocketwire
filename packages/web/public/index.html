<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="Control and monitor coding agents from your phone." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>pocketwire</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header id="topbar">
      <div class="brand">
        <span id="status-dot" class="dot off"></span>
        <span class="name">pocketwire</span>
        <span id="conn-label" class="conn">connecting</span>
      </div>
      <div class="meta">
        <span id="meta-agent" class="chip">no agent</span>
        <span id="meta-sessions" class="chip">0 sessions</span>
        <button id="btn-settings" class="icon-btn" title="Settings">&#8942;</button>
      </div>
    </header>

    <main id="feed" aria-live="polite"></main>

    <div id="chips-row">
      <span id="chips-label">skills</span>
      <div id="chips"></div>
    </div>

    <footer id="composer">
      <div class="actions">
        <button id="btn-continue" class="btn subtle" title="Nudge the agent">continue</button>
        <button id="btn-screenshot" class="btn subtle" title="Request a screenshot">shot</button>
        <button id="btn-abort" class="btn danger" title="Stop the current run">abort</button>
      </div>
      <div class="row">
        <textarea id="input" rows="1" placeholder="Message the agent on your PC…" enterkeyhint="send"></textarea>
        <button id="btn-send" class="btn primary">send</button>
      </div>
    </footer>

    <div id="lightbox" hidden></div>

    <div id="settings" hidden>
      <div class="sheet">
        <h2>pocketwire</h2>
        <label>access token</label>
        <input id="set-token" type="password" spellcheck="false" />
        <div class="hint">Token is printed by the relay on startup.</div>
        <div class="actions">
          <button id="btn-save" class="btn primary">save</button>
          <button id="btn-close" class="btn subtle">close</button>
        </div>
        <div class="hint faint">
          Same Wi-Fi: http://&lt;pc-ip&gt;:8787 &middot; Remote: Tailscale URL
        </div>
      </div>
    </div>

    <div id="token-screen" hidden>
      <div class="card">
        <h1>pocketwire</h1>
        <p>Enter the access token printed by the relay when it starts.</p>
        <input id="tok-input" type="password" placeholder="token" spellcheck="false" />
        <button id="btn-tok" class="btn primary">connect</button>
        <div id="tok-error" class="err hidden"></div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
